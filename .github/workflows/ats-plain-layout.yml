name: ATS plain visual QA
on:
  pull_request:
    paths:
      - 'core/resume_view_model.py'
      - 'core/resume_builder.py'
      - 'core/profile_adapter.py'
      - 'core/browser_renderer.py'
      - 'scripts/qa_ats_plain_layout.py'
      - 'scripts/qa_modern_navy_layout.py'
      - 'tests/test_ats_plain_design.py'
      - '.github/workflows/ats-plain-layout.yml'
permissions:
  contents: read
jobs:
  ats-plain-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -e '.[all]' 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Materialize the exact comparison revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          mkdir -p "$RUNNER_TEMP/offerget-baseline"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/offerget-baseline"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/offerget-baseline/revision.txt"
      - name: Test source, aliases, Markdown and HTML contracts
        run: python -m pytest tests/test_ats_plain_design.py -v
      - name: Check actual production PDF and responsive HTML
        env:
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/qa_ats_plain_layout.py \
            --baseline-root "$RUNNER_TEMP/offerget-baseline" \
            --output output/ats-plain-visual
      - name: Preserve before and after PDFs, screenshots, source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-plain-visual-${{ github.sha }}
          path: output/ats-plain-visual
          if-no-files-found: error
          retention-days: 14
