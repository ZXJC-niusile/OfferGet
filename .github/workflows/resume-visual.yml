name: Resume visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'themes/modern-navy.html'
      - 'core/resume_view_model.py'
      - 'scripts/qa_modern_navy_layout.py'
      - 'tests/test_modern_navy_layout.py'
      - '.github/workflows/resume-visual.yml'
  push:
    branches: [main]
    paths:
      - 'themes/modern-navy.html'
      - 'core/resume_view_model.py'
      - 'scripts/qa_modern_navy_layout.py'
      - 'tests/test_modern_navy_layout.py'
      - '.github/workflows/resume-visual.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated visual-test dependencies
        run: |
          python -m pip install -e '.[all]' 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Materialize the exact comparison revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          mkdir -p "$RUNNER_TEMP/offerget-baseline"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/offerget-baseline"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/offerget-baseline/revision.txt"
      - name: Render synthetic fixtures and check layout
        env:
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/qa_modern_navy_layout.py \
            --baseline-root "$RUNNER_TEMP/offerget-baseline" \
            --output-dir output/visual-regression
      - name: Preserve screenshots, PDFs, and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-navy-visual-${{ github.sha }}
          path: output/visual-regression/
          if-no-files-found: error
          retention-days: 14
