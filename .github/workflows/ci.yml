name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Fast tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"
      - name: Run fast regression suite
        run: python -m pytest tests -m "not browser and not package" -ra --strict-markers

  integration:
    name: Browser and installed package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install integration dependencies and browser
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]" "playwright==1.62.0"
          python -m playwright install --with-deps chromium
      - name: Select the installed browser
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                  output.write("BROWSER_PATH=" + runtime.chromium.executable_path + "\n")
          PY
      - name: Environment diagnostics
        run: python cli.py doctor
      - name: Run browser and package regression suite
        run: python -m pytest tests -m "browser or package" -ra --strict-markers
