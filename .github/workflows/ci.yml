name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Fast tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"
      - name: Run fast regression suite
        run: python -m pytest tests -m "not browser and not package" -ra --strict-markers

  integration:
    name: Browser and installed package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install integration dependencies and browser
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]" "playwright==1.62.0"
      - name: Install pinned Linux Chromium
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Ubuntu restricts user namespaces for downloaded Chromium builds.
          # Use the packaged Chrome helper without disabling the browser sandbox.
          sandbox=/opt/google/chrome/chrome-sandbox
          if [[ ! -x "$sandbox" || ! -u "$sandbox" ]]; then
            echo "::error::The runner is missing the packaged Chrome setuid sandbox: $sandbox"
            exit 1
          fi
          echo "CHROME_DEVEL_SANDBOX=$sandbox" >> "$GITHUB_ENV"
      - name: Select the installed browser
        shell: bash
        run: |
          python - <<'PY'
          import os
          if os.name == "nt":
              # Use the stable browser supported by the production discovery path.
              # Downloaded Chromium hangs in CLI print-to-PDF on Windows runners.
              from core.browser_renderer import BrowserRenderer
              browser_path = BrowserRenderer.find_browser()
          else:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as runtime:
                  browser_path = runtime.chromium.executable_path
          print("Selected browser:", browser_path)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("BROWSER_PATH=" + browser_path + "\n")
          PY
      - name: Environment diagnostics
        run: python cli.py doctor
      - name: Run browser and package regression suite
        run: python -m pytest tests -m "browser or package" -ra --strict-markers
