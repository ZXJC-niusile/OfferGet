name: Set up OfferGet checks
description: Install Python, project extras and the optional pinned browser.
inputs:
  python-version:
    description: Python version
    default: '3.12'
  extras:
    description: Project dependency group (all or render)
    default: all
  browser:
    description: Browser setup (none, system or chromium)
    default: none
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install project dependencies
      shell: bash
      env:
        OFFERGET_EXTRAS: ${{ inputs.extras }}
      run: |
        case "$OFFERGET_EXTRAS" in all|render) ;; *) exit 2 ;; esac
        python -m pip install -e ".[${OFFERGET_EXTRAS}]"
    - name: Install browser tooling
      if: inputs.browser != 'none'
      shell: bash
      run: python -m pip install 'playwright==1.62.0'
    - name: Select isolated browser cache
      if: inputs.browser == 'chromium'
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/offerget-browsers" >> "$GITHUB_ENV"
    - name: Cache pinned Chromium
      if: inputs.browser == 'chromium'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/offerget-browsers
        key: ${{ runner.os }}-offerget-playwright-1.62.0
    - name: Install Chromium and system dependencies
      if: inputs.browser == 'chromium'
      shell: bash
      run: python -m playwright install --with-deps chromium
