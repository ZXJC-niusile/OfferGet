<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Sidebar Clean Theme</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

      /* Modern Tech Cobalt & Slate Palette */
      --color-primary: #1E3A8A;         /* Dark Navy / Deep Blue */
      --color-accent: #2563EB;          /* Vibrant Tech Cobalt */
      --color-text: #0F172A;            /* Charcoal Black */
      --color-muted: #64748B;           /* Cool Gray */
      --color-sidebar-bg: #F8FAFC;     /* Light Slate Sidebar Tint */
      --color-border: #E2E8F0;          /* Crisp Border */
      --color-tag-bg: #EFF6FF;          /* Blue Pill Tag Tint */
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 8.0mm;
      --page-padding-x: 9.5mm;
      --body-font-size: 11.2px;
      --body-line-height: 1.54;
      --item-gap: 4.0px;
      --section-gap: 9.0px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: 58mm 1fr;
      grid-auto-flow: dense;
      column-gap: 6.5mm;
      row-gap: 2mm;
    }

    /* Top Full-Width Header */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2.5px solid var(--color-primary);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.2px;
    }

    .contacts {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: var(--color-muted);
      margin-top: 3px;
    }

    .contacts a {
      color: var(--color-accent);
      text-decoration: none;
    }

    /* Column Placement */
    #education, #skills {
      grid-column: 1;
      background: var(--color-sidebar-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 8px;
      align-self: start;
    }

    #experience, #projects {
      grid-column: 2;
      align-self: start;
      margin-bottom: 8px;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .section-header h2 {
      font-size: 12.8px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-header .rule {
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    /* Left Sidebar Compact Card Formatting */
    #education .org-bar {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 1px;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    #education .org-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text);
    }

    #education .org-role {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-accent);
    }

    #education .org-right {
      font-size: 10.2px;
      color: var(--color-muted);
    }

    #education .edu-grid {
      grid-template-columns: 1fr !important;
      row-gap: 2px;
      font-size: 10.8px;
      margin-top: 3px;
    }

    #skills ul li {
      font-size: 10.8px;
      line-height: 1.45;
      margin-bottom: 5px;
      padding-left: 0;
    }

    #skills ul li::before {
      display: none;
    }

    .skill-category {
      font-weight: 700;
      color: var(--color-primary);
      display: block;
      margin-bottom: 1.5px;
    }

    /* Right Main Column Formatting */
    #experience .org-bar, #projects .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px dashed var(--color-border);
      padding-bottom: 2px;
      margin-top: var(--item-gap);
      margin-bottom: 3.5px;
    }

    .org-title {
      font-weight: 700;
      font-size: 12.5px;
      color: var(--color-primary);
    }

    .org-role {
      font-weight: 600;
      font-size: 11.5px;
      color: var(--color-accent);
      margin-left: 6px;
    }

    .org-right {
      font-size: 10.8px;
      color: var(--color-muted);
      font-family: var(--font-mono);
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    #experience li, #projects li {
      position: relative;
      padding-left: 14px;
      margin-bottom: var(--item-gap);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
    }

    #experience li::before, #projects li::before {
      content: "▸";
      position: absolute;
      left: 1px;
      color: var(--color-accent);
      font-size: 10px;
    }

    b, strong {
      color: var(--color-text);
      font-weight: 700;
    }

    .num, .metric {
      font-weight: 600;
      color: var(--color-primary);
    }

    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div style="flex:1;">
        <div class="header-top">
          <h1>{{NAME}}</h1>
          <span style="font-size:12.5px; font-weight:600; color:var(--color-accent);">求职意向：{{TITLE}}</span>
        </div>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span>{{LOCATION}}</span>
        </div>
      </div>
    </header>

    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
