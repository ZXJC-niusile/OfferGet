<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - ASu Dense Tech Theme</title>
  <style>
    :root {
      /* ASu Hardcore Tech Typography */
      --font-serif: Georgia, "Noto Serif CJK SC", "Songti SC", STSong, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Consolas, monospace;

      /* ASu Signature Palette */
      --color-bg-page: #FFFEFA;          /* Warm Ivory Paper (象牙白) */
      --color-text: #141413;             /* Deep Slate Text (板岩深黑) */
      --color-primary: #245579;          /* Deep Ink Blue (深海蓝) */
      --color-accent: #D97757;           /* Clay Terracotta (赤陶强调色) */
      --color-muted: #64748B;            /* Muted Slate */
      --color-border: #D1CFC5;           /* Warm Oat Border */
      --color-rule: #366F96;             /* Accent Rule Line */
      --color-bar-bg: #E5F1F5;          /* Blue Bar Shading */
      --color-bar-border: #BCE0EE;       /* Subtle Band Border */
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 8.5mm;
      --page-padding-x: 10.5mm;
      --body-font-size: 11.5px;
      --body-line-height: 1.52;
      --item-gap: 4.0px;
      --section-gap: 9.8px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #F0EEE6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: var(--color-bg-page);
      position: relative;
    }

    /* Masthead & Title */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 6px;
      margin-bottom: var(--section-gap);
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 23px;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.3px;
      line-height: 1.1;
    }

    .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--color-muted);
      margin-top: 4px;
      font-family: var(--font-sans);
    }

    .contacts a {
      color: var(--color-primary);
      text-decoration: none;
      border-bottom: 1px solid rgba(36, 85, 121, 0.25);
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: var(--section-gap);
      margin-bottom: 5px;
    }

    .section-header h2 {
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .section-header .rule {
      flex: 1;
      height: 1.2px;
      background: linear-gradient(to right, var(--color-rule), var(--color-border));
    }

    /* Organization Bars with ASu Colored Tinting */
    .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--color-bar-bg);
      border-left: 3px solid var(--color-primary);
      padding: 3px 8px;
      border-radius: 2px;
      margin-top: var(--item-gap);
      margin-bottom: 3.5px;
    }

    .org-title {
      font-size: 12.2px;
      font-weight: 700;
      color: var(--color-text);
    }

    .org-role {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .org-right {
      font-size: 10.8px;
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-weight: 500;
    }

    /* High-density Bullet Lists */
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    li {
      position: relative;
      padding-left: 14px;
      margin-bottom: var(--item-gap);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
    }

    li::before {
      content: "▪";
      position: absolute;
      left: 2px;
      color: var(--color-accent);
      font-size: 9px;
      top: -0.5px;
    }

    /* Metrics & Numbers */
    b, strong {
      color: var(--color-text);
      font-weight: 700;
    }

    .num, .metric {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--color-primary);
    }

    code, .cli {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: #F4EFEB;
      padding: 1px 4px;
      border-radius: 2px;
      border: 1px solid #E3DACC;
    }

    /* Education Grid */
    .edu-grid {
      display: grid;
      row-gap: 3px;
      font-size: 11.2px;
      color: var(--color-muted);
      padding: 2px 4px;
    }

    .skill-category {
      font-weight: 700;
      color: var(--color-primary);
      margin-right: 6px;
    }

    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div style="flex:1;">
        <div class="header-top">
          <h1>{{NAME}}</h1>
          <span style="font-size:12px; font-weight:600; color:var(--color-primary);">求职意向：{{TITLE}}</span>
        </div>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span>{{LOCATION}}</span>
        </div>
      </div>
    </header>

    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
