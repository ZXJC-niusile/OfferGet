<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Modern Navy Theme</title>
  <style>
    :root {
      /* Typography Stack - Modern Serif for Headings & Metric Numbers, Refined Sans for Body */
      --font-serif: "Playfair Display", Georgia, "Times New Roman", "Songti SC", "Source Han Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      
      /* Modern Navy Executive Color Palette */
      --color-primary: #0F172A;          /* Deep Slate / Dark Navy (主色调 商务深藏蓝) */
      --color-primary-light: #1E293B;    /* Navy Charcoal */
      --color-accent: #0284C7;           /* Sky / Cerulean Blue (强调色 亮蓝) */
      --color-accent-dark: #0369A1;      /* Deep Cerulean */
      --color-accent-subtle: #E0F2FE;    /* Soft Sky Tint */
      --color-text: #1E293B;             /* Primary Text */
      --color-muted: #64748B;            /* Muted Slate Text */
      --color-rule: #E2E8F0;             /* Delicate Section Rule Line */
      --color-rule-accent: #0284C7;      /* Section Accent Pin */
      --color-bg-bar: #F8FAFC;          /* Sophisticated Executive Band */
      --color-bar-border: #E2E8F0;       /* Border for Org Band */
      --color-code-bg: #F1F5F9;         /* Inline Code Background */
      --color-code-border: #CBD5E1;     /* Inline Code Border */
      --color-todo-bg: #FEF3C7;          /* Warning Yellow Tint */
      --color-todo-text: #92400E;        /* Warning Amber Text */

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 8.8mm;
      --page-padding-x: 10.6mm;
      --body-font-size: 12.0px;
      --body-line-height: 1.62;
      --item-gap: 4.8px;
      --section-gap: 11.0px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
      position: relative;
    }

    /* Numbers & Metrics Typography - Luxury Serif High-Impact Numbers */
    .en, .num, .metric {
      font-family: var(--font-serif);
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    /* Inline Code & CLI Terminals */
    code, .cli {
      font-family: var(--font-mono);
      font-size: 0.92em;
      background: var(--color-code-bg);
      color: var(--color-primary);
      padding: 1px 5px;
      border-radius: 2px;
      border: 1px solid var(--color-code-border);
      word-break: break-all;
    }

    /* Links */
    a {
      color: var(--color-accent-dark);
      text-decoration: none;
      transition: color 0.15s ease;
      border-bottom: 1px dotted rgba(2, 132, 199, 0.4);
    }

    a:hover {
      color: var(--color-accent);
      border-bottom-style: solid;
    }

    /* ==========================================================================
       Header Block
       ========================================================================== */
    header {
      margin-bottom: 8px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1.5px solid var(--color-primary);
      padding-bottom: 4px;
      margin-bottom: 5px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--color-primary);
      line-height: 1.1;
    }

    .contacts {
      font-size: 11px;
      color: var(--color-muted);
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .contacts span {
      display: inline-flex;
      align-items: center;
    }

    .headline {
      font-size: 11.5px;
      color: var(--color-primary-light);
      font-weight: 500;
      line-height: 1.45;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .headline b {
      color: var(--color-accent-dark);
      font-weight: 600;
    }

    /* ==========================================================================
       Section Headers
       ========================================================================== */
    .section-header {
      display: flex;
      align-items: center;
      margin-top: var(--section-gap);
      margin-bottom: 4px;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 12.8px;
      font-weight: 700;
      color: var(--color-primary);
      white-space: nowrap;
      margin-right: 10px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      position: relative;
      padding-left: 8px;
    }

    h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 12px;
      background-color: var(--color-accent);
      border-radius: 1px;
    }

    .rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--color-rule), rgba(226, 232, 240, 0.3));
      border: none;
    }

    /* ==========================================================================
       Organization / Experience Bar
       ========================================================================== */
    .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background-color: var(--color-bg-bar);
      border-left: 2.5px solid var(--color-accent);
      border-top: 1px solid var(--color-bar-border);
      border-right: 1px solid var(--color-bar-border);
      border-bottom: 1px solid var(--color-bar-border);
      padding: 3px 8px;
      border-radius: 0 2px 2px 0;
      margin-top: 5px;
      margin-bottom: 3px;
      font-size: 11.5px;
    }

    .org-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .org-title {
      font-weight: 700;
      color: var(--color-primary);
    }

    .org-role {
      font-weight: 600;
      color: var(--color-accent-dark);
    }

    .org-right {
      font-family: var(--font-serif);
      font-size: 11px;
      color: var(--color-muted);
      font-weight: 500;
    }

    /* Lead Paragraph */
    .lead {
      font-weight: 600;
      color: var(--color-primary-light);
      margin-bottom: 3px;
    }

    /* ==========================================================================
       Project Header Block
       ========================================================================== */
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .project-tag {
      font-family: var(--font-sans);
      font-size: 10.5px;
      color: var(--color-muted);
      font-weight: 500;
      background: var(--color-accent-subtle);
      color: var(--color-accent-dark);
      padding: 0 5px;
      border-radius: 2px;
    }

    /* ==========================================================================
       Bullet Lists & Item Hierarchy
       ========================================================================== */
    ul {
      list-style-type: none;
      padding-left: 0;
    }

    li {
      position: relative;
      padding-left: 14px;
      margin-bottom: var(--item-gap);
      text-align: justify;
    }

    li::before {
      content: "▪";
      position: absolute;
      left: 2px;
      color: var(--color-accent);
      font-size: 9px;
      line-height: 1.7;
    }

    li.sub {
      padding-left: 24px;
    }

    li.sub::before {
      content: "▫";
      left: 12px;
      color: var(--color-muted);
      font-size: 8px;
    }

    /* Highlight Key Terms & Numbers */
    b, strong {
      color: var(--color-primary);
      font-weight: 700;
    }

    /* TODO Warning Marker */
    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header>
      <div class="header-top">
        <h1>{{NAME}}</h1>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span><a href="{{GITHUB_URL}}" target="_blank">{{GITHUB_HANDLE}}</a></span>
        </div>
      </div>
      <div class="headline">
        <b>{{HEADLINE_BADGES}}</b>
      </div>
    </header>

    <!-- Content Sections injected here -->
    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
