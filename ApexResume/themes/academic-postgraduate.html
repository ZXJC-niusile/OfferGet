<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Academic Postgraduate Theme</title>
  <style>
    :root {
      /* Formal Chinese Academic Typography */
      --font-serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", STSong, "SimSun", serif;
      --font-sans: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;

      /* Academic Burgundy & Ink Palette */
      --color-primary: #8B1E1E;         /* Academic Crimson / Burgundy (学术红) */
      --color-primary-dark: #661010;    /* Deep Crimson */
      --color-text: #1A1A1A;            /* Ink Black */
      --color-muted: #555555;           /* Charcoal Gray */
      --color-border: #D1D5DB;          /* Formal Gray Rule */
      --color-bg-subtle: #FDFBF7;       /* Warm Parchment Tint */
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 9.2mm;
      --page-padding-x: 11.5mm;
      --body-font-size: 11.8px;
      --body-line-height: 1.60;
      --item-gap: 4.5px;
      --section-gap: 10.5px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
      position: relative;
    }

    /* Academic Header with Double Rule */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--color-primary);
      border-bottom: 2.5px solid var(--color-primary);
      padding: 6px 0;
      margin-bottom: var(--section-gap);
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 2px;
    }

    .contacts {
      display: flex;
      gap: 12px;
      font-size: 11.2px;
      color: var(--color-muted);
      margin-top: 4px;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: var(--section-gap);
      margin-bottom: 5px;
      border-bottom: 1.5px solid var(--color-primary);
      padding-bottom: 2.5px;
    }

    .section-header h2 {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 1px;
    }

    .section-header .rule {
      display: none;
    }

    /* Organization Bars */
    .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: var(--item-gap);
      margin-bottom: 3.5px;
    }

    .org-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 12.8px;
      color: var(--color-text);
    }

    .org-role {
      font-weight: 600;
      font-size: 11.8px;
      color: var(--color-primary);
      margin-left: 8px;
    }

    .org-right {
      font-size: 11.0px;
      color: var(--color-muted);
      font-family: var(--font-mono);
    }

    /* Academic Bullet Lists */
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    li {
      position: relative;
      padding-left: 14px;
      margin-bottom: var(--item-gap);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
    }

    li::before {
      content: "◆";
      position: absolute;
      left: 1px;
      color: var(--color-primary);
      font-size: 7.5px;
      top: 1px;
    }

    /* Education Grid */
    .edu-grid {
      display: grid;
      row-gap: 3px;
      font-size: 11.2px;
      color: var(--color-muted);
      background: var(--color-bg-subtle);
      border: 1px solid #EFE8DC;
      padding: 5px 8px;
      border-radius: 3px;
      margin-top: 3.5px;
    }

    b, strong {
      color: var(--color-text);
      font-weight: 700;
    }

    .num, .metric {
      font-family: var(--font-serif);
      font-weight: 600;
      color: var(--color-primary);
    }

    .skill-category {
      font-weight: 700;
      color: var(--color-primary);
      margin-right: 6px;
    }

    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }

    /* Postgraduate Exam Score Table & Target Bar */
    .exam-target-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11.8px;
      color: var(--color-text);
      margin-top: var(--item-gap, 4px);
      margin-bottom: 4px;
      font-family: var(--font-sans);
    }

    .exam-score-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 3px;
      margin-bottom: 6px;
      text-align: center;
      font-size: 11.2px;
      border: 1.2px solid var(--color-primary);
    }

    .exam-score-table th,
    .exam-score-table td {
      border: 1px solid #D8CFC4;
      padding: 3.5px 5px;
      line-height: 1.35;
    }

    .exam-score-table thead th {
      background-color: var(--color-bg-subtle);
      font-weight: 600;
      color: var(--color-text);
      border-bottom: 1.5px solid var(--color-primary);
    }

    .exam-score-table th.score-label {
      background-color: #F5EFEB;
      color: var(--color-primary-dark);
      font-weight: 700;
      font-family: var(--font-serif);
      width: 16%;
    }

    .exam-score-table td.score-sublabel {
      background-color: var(--color-bg-subtle);
      font-weight: 600;
      color: var(--color-muted);
    }

    .exam-score-table th.score-total-head {
      background-color: #F8ECE8;
      color: var(--color-primary);
      font-weight: 700;
    }

    .exam-score-table td.score-total-val {
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--color-primary);
      font-size: 12px;
      background-color: #FCF6F4;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div style="flex:1;">
        <div class="header-top">
          <h1>{{NAME}}</h1>
          <span style="font-size:12.5px; font-weight:600; color:var(--color-primary);">申请方向：{{TITLE}}</span>
        </div>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>|</span>
          <span>{{EMAIL}}</span>
          <span>|</span>
          <span>{{LOCATION}}</span>
        </div>
      </div>
    </header>

    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
