name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -U pip setuptools wheel && pip install -e ".[test,docs]"

      - name: Run environment check
        run: python cli.py doctor

      - name: Run test suite
        run: python -m pytest tests -v

      - name: Run ApexResume tests
        run: python -m pytest ApexResume/tests -v

      - name: Run selftest
        run: python cli.py selftest
