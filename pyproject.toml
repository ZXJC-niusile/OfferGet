[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerget"
version = "1.0.0"
description = "Local-first JD analysis, resume auditing, academic application, and offer strategy toolkit"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest"]
render = ["pypdf"]
dev = ["ruff"]

[project.scripts]
offerget = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "presentation*", "ApexResume*", "templates*", "services*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.md"]
"templates" = ["*.html", "*.css"]
"ApexResume" = ["themes/*", "themes/**/*"]
