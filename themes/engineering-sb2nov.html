<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Engineering sb2nov Theme</title>
  <style>
    :root {
      /* A traditional LaTeX-like engineering resume, including local CJK serif fallbacks. */
      --font-serif: "Times New Roman", Times, "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      --font-mono: Consolas, "Courier New", monospace;
      --color-primary: #111111;
      --color-primary-dark: #111111;
      --color-accent: #333333;
      --color-text: #111111;
      --color-muted: #333333;
      --color-border: #555555;
      --color-bg-subtle: #FFFFFF;
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Keep all six controls available to the existing AutoFit engine. */
      --page-padding-y: 12.7mm;
      --page-padding-x: 14mm;
      --body-font-size: 13.333px;
      --body-line-height: 1.45;
      --item-gap: 3.5px;
      --section-gap: 11px;
    }
    @page { size: A4 portrait; margin: var(--page-padding-y) 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-serif);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .cli { font-family: var(--font-mono); font-size: 0.92em; overflow-wrap: anywhere; }
    .en, .num, .metric { font-variant-numeric: tabular-nums; }

    /* The renderer replaces the static header. Override its inline defaults here
       to retain the centered, monochrome design on the actual production path. */
    header {
      gap: 14px;
      text-align: center;
      border: 0 !important;
      padding: 0 0 3px !important;
      margin-bottom: 0 !important;
    }
    header > div:first-child { min-width: 0; padding-right: 0 !important; }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      flex-direction: column;
      align-items: center !important;
      gap: 2px;
    }
    .header-top > * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    h1 {
      font-family: var(--font-serif);
      font-size: 28px !important;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.4px;
      color: var(--color-text);
    }
    .header-top > span {
      font-size: 1em !important;
      font-weight: 400 !important;
      color: var(--color-muted) !important;
    }
    .contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 2px 8px !important;
      font-size: 0.95em !important;
    }
    .contacts span { display: inline-flex; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .contacts a { min-width: 0; overflow-wrap: anywhere; text-decoration: underline !important; }
    .headline, .lead { margin-top: 3px; overflow-wrap: anywhere; }

    /* Small-cap-style section labels and a crisp black rule, like a typeset CV. */
    .section-header {
      display: block;
      margin-top: var(--section-gap);
      margin-bottom: 4px;
      padding-bottom: 1px;
      border-bottom: 0.75px solid var(--color-primary);
    }
    .section-header h2 {
      font-family: var(--font-serif);
      font-size: 1.08em;
      font-weight: 700;
      font-variant-caps: small-caps;
      color: var(--color-primary);
      letter-spacing: 0.3px;
    }
    .section-header .rule { display: none; }

    /* Plain two-line entries: bold organization, italic role, right-aligned date. */
    .org-bar, .project-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 1px 14px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .org-left, .project-header > div:first-child {
      display: flex;
      flex: 1 1 24em;
      flex-wrap: wrap;
      flex-direction: column;
      min-width: 0;
      align-items: flex-start !important;
      gap: 0 !important;
    }
    .org-left > *, .project-header > div:first-child > * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .org-title, .project-header > div:first-child > span:first-child {
      font-size: 1.02em !important;
      font-weight: 700;
      color: var(--color-text) !important;
    }
    .org-role, .project-header > div:first-child > span + span {
      font-size: 1em !important;
      font-weight: 400 !important;
      font-style: italic;
      color: var(--color-text) !important;
    }
    .org-right, .project-header > div:last-child {
      flex: 0 1 auto;
      max-width: 100%;
      margin-left: auto;
      overflow-wrap: anywhere;
      text-align: right;
      font-size: 0.95em !important;
      font-style: italic;
      font-variant-numeric: tabular-nums;
    }
    .edu-grid {
      display: flex !important;
      flex-wrap: wrap;
      gap: 2px 18px;
      font-size: 0.95em !important;
    }
    .edu-grid > div { flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }
    h3 { font-size: 1em; font-weight: 700; }
    .project-tag { font-style: italic; color: var(--color-muted); }

    ul { list-style: disc; padding-left: 17px; margin-top: 1px; }
    li { padding-left: 1px; margin-bottom: var(--item-gap); overflow-wrap: anywhere; }
    li::marker { font-size: 0.85em; color: var(--color-text); }
    li.sub { margin-left: 14px; list-style-type: circle; }
    #skills li { flex-wrap: wrap; padding-left: 0; font-size: 1em !important; }
    #skills li > span { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    #skills li > span:first-child { white-space: normal !important; flex-shrink: 1 !important; }
    b, strong, .skill-category { font-weight: 700; color: var(--color-text); }

    /* Retain optional exam data without introducing colored cells into this theme. */
    .exam-target-bar { flex-wrap: wrap; gap: 3px 16px; font-size: 1em !important; }
    .exam-target-bar > span { flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }
    .exam-score-table { table-layout: fixed; font-size: 0.95em !important; }
    .exam-score-table tr, .exam-score-table th, .exam-score-table td {
      background: transparent !important;
      border-color: var(--color-border) !important;
      overflow-wrap: anywhere;
    }

    /* A missing-fact warning remains visible even in an otherwise monochrome CV. */
    .todo {
      background: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 3px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
    @media print {
      .page {
        min-height: calc(297mm - 2 * var(--page-padding-y));
        padding-top: 0;
        padding-bottom: 0;
      }
      header, .section-header, .org-bar, .project-header {
        break-inside: avoid;
        break-after: avoid;
      }
      li { break-inside: avoid; orphans: 2; widows: 2; }
      .exam-score-table { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <div class="header-top"><h1>{{NAME}}</h1><span>{{TITLE}}</span></div>
        <div class="contacts">
          <span>{{PHONE}}</span><span>•</span><span>{{EMAIL}}</span><span>•</span><span>{{LOCATION}}</span>
        </div>
      </div>
    </header>
    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
