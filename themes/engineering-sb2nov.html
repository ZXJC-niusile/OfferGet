<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Engineering sb2nov Theme</title>
  <style>
    :root {
      /* Classic Engineering Typography */
      --font-serif: "Times New Roman", Times, "Songti SC", "SimSun", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;

      /* High-Contrast Engineering Monochrome Palette */
      --color-primary: #000000;
      --color-text: #111111;
      --color-muted: #333333;
      --color-rule: #000000;
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 8.5mm;
      --page-padding-x: 11.0mm;
      --body-font-size: 11.2px;
      --body-line-height: 1.48;
      --item-gap: 3.5px;
      --section-gap: 8.8px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-serif);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
      position: relative;
    }

    /* Centered Minimalist Engineering Header */
    header {
      text-align: center;
      margin-bottom: var(--section-gap);
      padding-bottom: 4px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .contacts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10.8px;
      color: var(--color-muted);
      font-family: var(--font-sans);
    }

    .contacts a {
      color: inherit;
      text-decoration: underline;
    }

    /* Uppercase Section Headers with Crisp Divider Line */
    .section-header {
      margin-top: var(--section-gap);
      margin-bottom: 4px;
      border-bottom: 0.75pt solid var(--color-rule);
      padding-bottom: 1.5px;
    }

    .section-header h2 {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .section-header .rule {
      display: none;
    }

    /* Organization Bars with Left/Right Alignment */
    .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: var(--item-gap);
      margin-bottom: 2px;
    }

    .org-title {
      font-weight: 700;
      font-size: 12.0px;
      color: var(--color-primary);
    }

    .org-role {
      font-weight: 600;
      font-size: 11.2px;
      font-style: italic;
      color: var(--color-muted);
      margin-left: 6px;
    }

    .org-right {
      font-size: 10.8px;
      font-style: italic;
      color: var(--color-muted);
    }

    /* Tight Disciplined Bullet Lists */
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 1.5px;
      margin-bottom: 3.5px;
    }

    li {
      position: relative;
      padding-left: 12px;
      margin-bottom: var(--item-gap);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
    }

    li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: var(--color-primary);
      font-size: 10px;
    }

    /* Education Grid */
    .edu-grid {
      display: grid;
      row-gap: 2px;
      font-size: 10.8px;
      margin-top: 2px;
    }

    b, strong {
      color: var(--color-primary);
      font-weight: 700;
    }

    .skill-category {
      font-weight: 700;
      color: var(--color-primary);
      margin-right: 4px;
    }

    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>{{NAME}}</h1>
      <div class="contacts">
        <span>{{PHONE}}</span>
        <span>|</span>
        <span>{{EMAIL}}</span>
        <span>|</span>
        <span>{{LOCATION}}</span>
      </div>
    </header>

    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
