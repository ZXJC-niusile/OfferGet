<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Modern Corporate Theme</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

      /* Executive Emerald Teal Palette */
      --color-primary: #0F5156;         /* Deep Emerald Teal */
      --color-primary-light: #166534;   /* Forest Green Accent */
      --color-accent: #0284C7;          /* Sky Blue */
      --color-text: #1E293B;            /* Slate Black */
      --color-muted: #64748B;           /* Cool Gray */
      --color-border: #E2E8F0;          /* Clean Line */
      --color-bg-card: #F8FAFC;        /* Subtle Card Background */
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Dynamic Layout Tokens for Auto-Fit Compaction Engine */
      --page-padding-y: 8.8mm;
      --page-padding-x: 10.8mm;
      --body-font-size: 11.6px;
      --body-line-height: 1.58;
      --item-gap: 4.4px;
      --section-gap: 10.2px;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
      position: relative;
    }

    /* Executive Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 7px;
      margin-bottom: var(--section-gap);
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.3px;
    }

    .contacts {
      display: flex;
      gap: 10px;
      font-size: 11.2px;
      color: var(--color-muted);
      margin-top: 4px;
    }

    .contacts a {
      color: var(--color-primary);
      text-decoration: none;
    }

    /* Section Headers with Accent Badge */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: var(--section-gap);
      margin-bottom: 5px;
    }

    .section-header h2 {
      font-size: 13.2px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .section-header .rule {
      flex: 1;
      height: 1.2px;
      background: linear-gradient(to right, var(--color-primary), var(--color-border));
    }

    /* Organization Bars with Clean Outline */
    .org-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--color-bg-card);
      border-left: 3px solid var(--color-primary);
      padding: 3.5px 8px;
      border-radius: 2px;
      margin-top: var(--item-gap);
      margin-bottom: 3.5px;
    }

    .org-title {
      font-size: 12.4px;
      font-weight: 700;
      color: var(--color-text);
    }

    .org-role {
      font-size: 11.6px;
      font-weight: 600;
      color: var(--color-primary);
      margin-left: 6px;
    }

    .org-right {
      font-size: 10.8px;
      color: var(--color-muted);
      font-family: var(--font-mono);
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    li {
      position: relative;
      padding-left: 14px;
      margin-bottom: var(--item-gap);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
    }

    li::before {
      content: "▪";
      position: absolute;
      left: 2px;
      color: var(--color-primary);
      font-size: 8.5px;
    }

    b, strong {
      color: var(--color-primary);
      font-weight: 700;
    }

    .num, .metric {
      font-weight: 600;
      color: var(--color-primary);
    }

    .edu-grid {
      display: grid;
      row-gap: 3px;
      font-size: 11.2px;
      color: var(--color-muted);
      padding: 2px 4px;
    }

    .skill-category {
      font-weight: 700;
      color: var(--color-primary);
      margin-right: 6px;
    }

    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 4px;
      border-radius: 2px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div style="flex:1;">
        <div class="header-top">
          <h1>{{NAME}}</h1>
          <span style="font-size:12.5px; font-weight:600; color:var(--color-primary);">求职意向：{{TITLE}}</span>
        </div>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span>{{LOCATION}}</span>
        </div>
      </div>
    </header>

    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
