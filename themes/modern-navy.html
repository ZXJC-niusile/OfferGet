<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - Modern Navy Theme</title>
  <style>
    :root {
      /* One familiar, locally available family throughout the resume. */
      --font-sans: Arial, "Helvetica Neue", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, monospace;
      --color-primary: #18344D;
      --color-primary-dark: #202830;
      --color-accent: #394956;
      --color-text: #202830;
      --color-muted: #4A5660;
      --color-border: #A8B3BD;
      --color-todo-bg: #FEF3C7;
      --color-todo-text: #92400E;

      /* Keep all six tokens editable by the existing AutoFit engine. */
      --page-padding-y: 12.7mm;
      --page-padding-x: 14mm;
      --body-font-size: 13.333px;
      --body-line-height: 1.5;
      --item-gap: 4px;
      --section-gap: 13px;
    }

    @page {
      size: A4 portrait;
      /* Repeat the vertical gutter on every printed page. */
      margin: var(--page-padding-y) 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .cli { font-family: var(--font-mono); font-size: 0.95em; overflow-wrap: anywhere; }
    .en, .num, .metric { font-variant-numeric: tabular-nums; }

    /* The shared renderer has inline presentation defaults. Narrow overrides
       below change only this theme, leaving its content and other themes intact. */
    header { padding-bottom: 9px !important; }
    header > div:first-child { min-width: 0; }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      flex-direction: column;
      align-items: flex-start !important;
      gap: 3px;
    }
    .header-top > * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    h1 { font-size: 25px !important; font-weight: 700; color: var(--color-primary); line-height: 1.2; }
    .header-top > span { font-weight: 400 !important; font-size: 1em !important; }

    .contacts {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 3px 8px !important;
      font-size: 0.92em !important;
      color: var(--color-muted);
    }
    .contacts span {
      display: inline-flex;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      align-items: baseline;
    }
    .contacts a { min-width: 0; overflow-wrap: anywhere; }
    .headline, .lead { font-weight: 400; margin-top: 4px; overflow-wrap: anywhere; }

    /* Familiar resume section labels, with a single understated horizontal rule. */
    .section-header {
      display: block;
      margin-top: var(--section-gap);
      margin-bottom: 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--color-border);
    }
    h2 { font-size: 1.05em; font-weight: 700; color: var(--color-primary); letter-spacing: 0.15px; }
    .rule { display: none; }

    /* Employer/school and date form a plain heading row; the role sits below. */
    .org-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      justify-content: space-between;
      align-items: baseline;
      background: transparent;
      border: 0;
      padding: 0;
    }
    .org-left {
      display: flex;
      flex: 1 1 24em;
      flex-wrap: wrap;
      flex-direction: column;
      min-width: 0;
      align-items: flex-start !important;
      gap: 0 !important;
    }
    .org-left > *,
    .project-header > div:first-child > * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .org-title,
    .project-header > div:first-child > span:first-child {
      font-size: 1em !important;
      font-weight: 700;
    }
    .org-role,
    .project-header > div:first-child > span + span {
      font-size: 0.96em !important;
      font-weight: 400 !important;
      color: var(--color-text) !important;
    }
    .org-right,
    .project-header > div:last-child {
      flex: 0 0 auto;
      max-width: 100%;
      margin-left: auto;
      white-space: nowrap;
      font-size: 0.9em !important;
      font-variant-numeric: tabular-nums;
      color: var(--color-muted);
    }
    .project-header {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      justify-content: space-between;
      align-items: baseline;
    }
    .project-header > div:first-child {
      display: flex;
      flex: 1 1 24em;
      flex-wrap: wrap;
      flex-direction: column;
      min-width: 0;
      align-items: flex-start !important;
      gap: 0 !important;
    }
    .edu-grid { column-gap: 10px; font-size: 0.92em !important; }
    .edu-grid > div,
    #skills li > span { min-width: 0; overflow-wrap: anywhere; }
    h3 { font-size: 1em; font-weight: 700; }
    .project-tag { font-size: 0.96em; color: var(--color-muted); }

    /* Standard hanging bullets; wrapped lines share one clean text edge. */
    ul { list-style: disc; padding-left: 17px; }
    li {
      padding-left: 1px;
      margin-bottom: var(--item-gap);
      text-align: start;
      overflow-wrap: anywhere;
    }
    li::marker { color: var(--color-text); font-size: 0.85em; }
    li.sub { margin-left: 14px; list-style-type: circle; }
    #skills li { padding-left: 0; font-size: 1em !important; flex-wrap: wrap; }
    #skills li > span:first-child { white-space: normal !important; flex-shrink: 1 !important; }
    b, strong { color: var(--color-text); font-weight: 700; }

    /* Unresolved facts must remain visibly marked; this is not a resume badge. */
    .todo {
      background-color: var(--color-todo-bg);
      color: var(--color-todo-text);
      padding: 0 3px;
      border: 1px dashed var(--color-todo-text);
      font-weight: 600;
    }

    @media print {
      .page {
        /* Page margins own vertical padding, including continuation pages. */
        min-height: calc(297mm - 2 * var(--page-padding-y));
        padding-top: 0;
        padding-bottom: 0;
      }
      header, .section-header, .org-bar, .project-header {
        break-inside: avoid;
        break-after: avoid;
      }
      li { break-inside: avoid; orphans: 2; widows: 2; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header>
      <div class="header-top">
        <h1>{{NAME}}</h1>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span><a href="{{GITHUB_URL}}" target="_blank">{{GITHUB_HANDLE}}</a></span>
        </div>
      </div>
      <div class="headline">
        <b>{{HEADLINE_BADGES}}</b>
      </div>
    </header>

    <!-- Content Sections injected here -->
    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
