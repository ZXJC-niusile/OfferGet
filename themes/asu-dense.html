<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Resume - ASu Dense Theme</title>
  <style>
    :root {
      --font-sans: Arial, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", Consolas, "Liberation Mono", monospace;
      --color-text: #20252B;
      --color-primary: #263C50;
      --color-primary-dark: #20252B;
      --color-accent: #394B5C;
      --color-muted: #4D5660;
      --color-border: #A8B0B8;
      --color-bg-subtle: #F5F6F7;
      --color-todo-bg: #FFF3CD;
      --color-todo-text: #744B00;

      /* Dense remains compact, but all six AutoFit controls stay available. */
      --page-padding-y: 9mm;
      --page-padding-x: 12mm;
      --body-font-size: 12px;
      --body-line-height: 1.5;
      --item-gap: 3.5px;
      --section-gap: 9px;
    }

    @page {
      size: A4 portrait;
      margin: var(--page-padding-y) 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.resume-dense {
      font-family: var(--font-sans);
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--color-text);
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .resume-dense .page {
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-padding-y) var(--page-padding-x);
      margin: 0 auto;
      background: #FFFFFF;
    }

    /* Scoped overrides cover the actual shared renderer's inline markup. */
    .resume-dense header {
      align-items: flex-start !important;
      margin-bottom: var(--section-gap) !important;
      padding-bottom: 8px !important;
      border-bottom: 1.4px solid var(--color-primary) !important;
    }

    .resume-dense header > div:first-child {
      min-width: 0;
    }

    .resume-dense .header-top {
      display: block !important;
    }

    .resume-dense .header-top > * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .resume-dense h1 {
      font-family: var(--font-sans);
      font-size: 25px !important;
      line-height: 1.2;
      letter-spacing: 0;
      color: var(--color-primary);
      margin-bottom: 3px !important;
    }

    .resume-dense .header-top > span {
      display: block;
      font-size: 1em !important;
      font-weight: 500 !important;
      color: var(--color-text) !important;
    }

    .resume-dense .contacts {
      flex-wrap: wrap;
      gap: 2px 8px !important;
      align-items: baseline;
      font-size: 0.95em !important;
      line-height: 1.45;
      margin-top: 4px !important;
    }

    .resume-dense .contacts span,
    .resume-dense .contacts a {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .resume-dense a {
      color: inherit;
      text-decoration: none;
    }

    .resume-dense .section-header {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-top: var(--section-gap);
      margin-bottom: 4px;
      break-after: avoid;
    }

    .resume-dense .section-header h2 {
      flex: 0 1 auto;
      margin: 0 !important;
      font-size: 1.08em;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.025em;
      color: var(--color-primary);
    }

    .resume-dense .section-header .rule {
      flex: 1 1 20px !important;
      height: 0 !important;
      border: 0;
      border-bottom: 0.6px solid var(--color-border);
      background: none !important;
    }

    /* Plain, flush-left entries replace colored organization cards. */
    .resume-dense .org-bar,
    .resume-dense .project-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 2px 12px;
      margin-top: 5px !important;
      margin-bottom: 2px !important;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .resume-dense .org-left,
    .resume-dense .project-header > div:first-child {
      display: flex;
      flex: 1 1 26em;
      flex-wrap: wrap;
      min-width: 0;
      align-items: baseline;
      gap: 1px 9px !important;
    }

    .resume-dense .org-left > *,
    .resume-dense .project-header > div:first-child > * {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .resume-dense .org-title,
    .resume-dense .project-header > div:first-child > span:first-child {
      font-size: 1.04em !important;
      font-weight: 700 !important;
      color: var(--color-text) !important;
    }

    .resume-dense .org-role,
    .resume-dense .project-header > div:first-child > span + span {
      font-size: 1em !important;
      font-weight: 400 !important;
      color: var(--color-muted) !important;
    }

    .resume-dense .org-right,
    .resume-dense .project-header > div:last-child {
      flex: 0 1 auto;
      max-width: 100%;
      margin-left: auto;
      font-family: var(--font-sans);
      font-size: 0.95em !important;
      font-variant-numeric: tabular-nums;
      white-space: normal !important;
      overflow-wrap: anywhere;
      color: var(--color-muted) !important;
    }

    .resume-dense .edu-grid {
      column-gap: 10px;
      font-size: 0.97em !important;
      line-height: var(--body-line-height) !important;
      color: var(--color-text) !important;
      padding: 0;
    }

    .resume-dense .edu-grid > div {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .resume-dense ul {
      list-style: disc;
      padding-left: 1.25em;
      margin-top: 2px;
    }

    .resume-dense li {
      padding-left: 0.12em;
      margin-bottom: var(--item-gap);
      text-align: start;
      overflow-wrap: anywhere;
    }

    .resume-dense li::marker {
      color: var(--color-muted);
      font-size: 0.85em;
    }

    /* Skills read as ordinary labeled lines, including long bilingual labels. */
    .resume-dense #skills ul {
      list-style: none;
      padding-left: 0 !important;
    }

    .resume-dense #skills li {
      display: block !important;
      padding-left: 0;
      margin-bottom: var(--item-gap) !important;
      font-size: var(--body-font-size) !important;
      line-height: var(--body-line-height) !important;
    }

    .resume-dense #skills li > span {
      display: inline;
      min-width: 0;
      white-space: normal !important;
      overflow-wrap: anywhere;
    }

    .resume-dense b,
    .resume-dense strong {
      color: var(--color-text);
      font-weight: 700;
    }

    .resume-dense .num,
    .resume-dense .metric {
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      color: inherit;
    }

    .resume-dense code,
    .resume-dense .cli {
      font-family: var(--font-mono);
      font-size: 0.95em;
      background: transparent;
      border: 0;
      padding: 0;
      overflow-wrap: anywhere;
    }

    .resume-dense .todo {
      background: var(--color-todo-bg);
      color: var(--color-todo-text);
      border-bottom: 1px dashed currentColor;
      font-weight: 600;
    }

    @media print {
      .resume-dense .page {
        min-height: calc(297mm - 2 * var(--page-padding-y));
        padding-top: 0;
        padding-bottom: 0;
      }

      .resume-dense header,
      .resume-dense .section-header,
      .resume-dense .org-bar,
      .resume-dense .project-header {
        break-inside: avoid;
        break-after: avoid;
      }

      /* Allow a long entry to continue instead of leaving large blank areas. */
      .resume-dense ul {
        break-inside: auto !important;
        page-break-inside: auto !important;
      }

      .resume-dense li {
        break-inside: avoid;
        orphans: 2;
        widows: 2;
      }
    }
  </style>
</head>
<body class="resume-dense">
  <div class="page">
    <header>
      <div>
        <div class="header-top">
          <h1>{{NAME}}</h1>
          <span>{{TITLE}}</span>
        </div>
        <div class="contacts">
          <span>{{PHONE}}</span>
          <span>•</span>
          <span>{{EMAIL}}</span>
          <span>•</span>
          <span>{{LOCATION}}</span>
        </div>
      </div>
    </header>
    {{SECTIONS_CONTENT}}
  </div>
</body>
</html>
